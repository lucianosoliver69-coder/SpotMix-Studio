<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpotMix Studio</title><style>
:root{font-family:system-ui,sans-serif;color:#241b3b;background:#fcf8ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#6038d2,#f04ea9 70%,#ffab4f);color:white;padding:25px max(22px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:30px}header p{margin:5px 0 0}.wrap{max-width:1100px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:190px 1fr;gap:20px}nav,.card{background:white;border:1px solid #eee3f8;border-radius:20px;padding:20px;box-shadow:0 12px 30px #3822690c}nav{height:max-content;display:grid;gap:7px;position:sticky;top:20px}nav button{text-align:left;background:transparent;color:#594d73}nav button.active{background:#efe9fc;color:#623bd3}.card{margin-bottom:18px}h2{margin:0 0 8px}p,.muted{color:#736987}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#6c42d9;color:white}button.secondary{background:#f1eafa;color:#663ad1}button:disabled{opacity:.45;cursor:not-allowed}textarea,input,select{font:inherit}textarea{width:100%;height:180px;border:2px solid #e8dafa;border-radius:14px;padding:15px;resize:vertical}input[type=text],select{padding:11px;border:1px solid #ded2ee;border-radius:11px;width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-height:450px;overflow:auto}.choice{border:2px solid #eee5f8;border-radius:15px;padding:12px;cursor:pointer}.choice.selected{border-color:#7040df;background:#f6f0ff}.choice small{display:block;color:#746a87;margin:5px 0}.choice button{font-size:12px;padding:7px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.control label{display:block;font-weight:700}.control input{width:100%;accent-color:#e851ab}.bar{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.notice{padding:12px;border-radius:11px;background:#fff0dd;color:#734716;margin:12px 0}.hidden{display:none}audio{width:100%;margin:10px 0}.success{background:#e3faef;color:#08643d}@media(max-width:700px){.wrap{display:block}nav{display:flex;overflow:auto;position:static;margin-bottom:18px}nav button{white-space:nowrap}}
</style></head><body><header><h1>♫ SpotMix Studio</h1><p>Do texto ao comercial pronto, em poucos passos.</p></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script type="module" src="/app.js"></script></body></html>
